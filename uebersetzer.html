  <style>
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --text: #1b2421;
  --muted: #6b7672;
  --border: #d9dfdc;
  --accent: #1f6f5c;
  --accent-text: #ffffff;
  --danger: #c0392b;
  --bubble-de: #e7f1ee;
  --bubble-bg: #eef0f8;
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111715;
    --surface: #1b2320;
    --text: #e6ece9;
    --muted: #93a09b;
    --border: #2d3834;
    --accent: #3fb394;
    --accent-text: #0b1210;
    --danger: #e5675a;
    --bubble-de: #1e2f2a;
    --bubble-bg: #23273a;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 16px env(safe-area-inset-bottom);
}

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 16px 0 8px;
}

h1 { font-size: 1.3rem; margin: 0; }
h1 .pair { color: var(--accent); }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
.tab {
  border: 0; background: none; color: var(--text); font: inherit;
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
}
.tab.active { background: var(--accent); color: var(--accent-text); }

main { flex: 1; display: flex; flex-direction: column; }
.view { display: flex; flex-direction: column; flex: 1; gap: 12px; }
.view[hidden] { display: none; }

.lang-bar { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 600; }
.lang { min-width: 8.5em; text-align: center; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 1.2rem; cursor: pointer;
}

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }

.panel {
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  min-height: 180px;
}
.panel textarea, .output-text {
  flex: 1; width: 100%; min-height: 140px; padding: 14px;
  border: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 1.15rem; resize: vertical;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.panel textarea:focus { outline: none; }
.panel:focus-within { border-color: var(--accent); }
.output-text .interim, .bubble .interim { color: var(--muted); }

.panel-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); }
.small-btn {
  border: 0; background: none; color: var(--muted); font: inherit; font-size: .9rem;
  padding: 4px 8px; border-radius: 8px; cursor: pointer;
}
.small-btn:hover { background: var(--bg); color: var(--text); }
.muted { color: var(--muted); font-size: .9rem; }

.mic-row { display: flex; justify-content: center; padding: 8px 0; }
.mic-btn, .talk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600;
  background: var(--accent); color: var(--accent-text);
}
.mic-btn { padding: 14px 28px; font-size: 1.1rem; }
.mic-icon { font-size: 1.4rem; }
.mic-btn.listening, .talk-btn.listening { background: var(--danger); animation: pulse 1.4s infinite; }
.mic-btn:disabled, .talk-btn:disabled { opacity: .5; cursor: not-allowed; animation: none; }

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 60%, transparent); }
  70% { box-shadow: 0 0 0 16px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.chat {
  flex: 1; min-height: 240px; max-height: 60vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
}
.chat-empty { margin: auto; text-align: center; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: var(--radius); }
.bubble.de { align-self: flex-start; background: var(--bubble-de); }
.bubble.bg { align-self: flex-end; background: var(--bubble-bg); }
.bubble .original { font-size: .9rem; color: var(--muted); }
.bubble .translation { font-size: 1.15rem; font-weight: 500; }
.bubble button { margin-top: 4px; padding: 2px 6px; }

.talk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 8px; }
.talk-btn { flex-direction: column; gap: 4px; padding: 18px 12px; border-radius: var(--radius); font-size: 1rem; }
.talk-btn .flag { font-size: 1.8rem; }

.settings {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding: 12px 0 16px; color: var(--muted); font-size: .9rem;
}
.settings select {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 2px 6px;
}
.status { width: 100%; margin: 0; min-height: 1.5em; }
.status.error { color: var(--danger); }
</style>
</head>
<body>
  <header class="app-header">
    <h1>Übersetzer <span class="pair">DE ⇄ BG</span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="translator">Übersetzer</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="conversation">Gespräch</button>
    </nav>
  </header>

  <main>
    <!-- Übersetzer: Text oder Sprache, live übersetzt -->
    <section id="translator" class="view active" role="tabpanel">
      <div class="lang-bar">
        <span class="lang" id="sourceLabel">🇩🇪 Deutsch</span>
        <button id="swapBtn" class="icon-btn" title="Sprachen tauschen" aria-label="Sprachen tauschen">⇄</button>
        <span class="lang" id="targetLabel">🇧🇬 Bulgarisch</span>
      </div>

      <div class="panels">
        <div class="panel">
          <textarea id="sourceText" placeholder="Text eingeben oder Mikrofon antippen …" autofocus></textarea>
          <div class="panel-actions">
            <button id="clearBtn" class="small-btn" title="Leeren">✕ Leeren</button>
            <span id="charCount" class="muted">0</span>
          </div>
        </div>
        <div class="panel output">
          <div id="targetText" class="output-text" aria-live="polite"></div>
          <div class="panel-actions">
            <button id="speakBtn" class="small-btn" title="Vorlesen">🔊 Vorlesen</button>
            <button id="copyBtn" class="small-btn" title="Kopieren">⧉ Kopieren</button>
          </div>
        </div>
      </div>

      <div class="mic-row">
        <button id="micBtn" class="mic-btn" aria-pressed="false">
          <span class="mic-icon">🎤</span>
          <span id="micLabel">Sprechen</span>
        </button>
      </div>
    </section>

    <!-- Gespräch: zwei Personen sprechen abwechselnd -->
    <section id="conversation" class="view" role="tabpanel" hidden>
      <div id="chat" class="chat" aria-live="polite">
        <p class="chat-empty muted">
          Tippe auf deine Sprache und sprich. Die Übersetzung wird angezeigt und vorgelesen.<br>
          Натиснете своя език и говорете. Преводът се показва и прочита на глас.
        </p>
      </div>
      <div class="talk-row">
        <button class="talk-btn" data-lang="de">
          <span class="flag">🇩🇪</span>
          <span>Deutsch sprechen</span>
        </button>
        <button class="talk-btn" data-lang="bg">
          <span class="flag">🇧🇬</span>
          <span>Говоря български</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="settings">
    <label><input type="checkbox" id="autoSpeak" checked> Übersetzung automatisch vorlesen</label>
    <label>Dienst:
      <select id="provider">
        <option value="google">Google (kostenlos)</option>
        <option value="mymemory">MyMemory (kostenlos)</option>
      </select>
    </label>
    <p id="status" class="status" role="status"></p>
  </footer>

  <script>
/*
 * Translator – kleine, eigenständige Übersetzungsbibliothek (Deutsch ⇄ Bulgarisch).
 *
 * Kann unabhängig von der Oberfläche in jede Web-App eingebunden werden:
 *
 *   <script src="translator.js"><\/script>
 *   const t = new Translator({ provider: 'google' });
 *   const bg = await t.translate('Guten Morgen', 'de', 'bg');
 *
 * Unterstützte Dienste (beide ohne API-Schlüssel nutzbar):
 *   - 'google'   : inoffizieller Google-Translate-Endpunkt (schnell, gute Qualität)
 *   - 'mymemory' : MyMemory API (Tageslimit ~5000 Zeichen pro IP)
 * Fällt der gewählte Dienst aus, wird automatisch der andere versucht.
 */
(function (global) {
  'use strict';

  const MYMEMORY_MAX_BYTES = 450; // API-Limit liegt bei 500 Bytes pro Anfrage

  const providers = {
    async google(text, from, to, signal) {
      const url = 'https://translate.googleapis.com/translate_a/single' +
        `?client=gtx&dt=t&sl=${from}&tl=${to}&q=${encodeURIComponent(text)}`;
      const res = await fetch(url, { signal });
      if (!res.ok) throw new Error(`Google: HTTP ${res.status}`);
      const data = await res.json();
      return data[0].map((part) => part[0]).join('');
    },

    async mymemory(text, from, to, signal) {
      const chunks = splitIntoChunks(text, MYMEMORY_MAX_BYTES);
      const results = [];
      for (const chunk of chunks) {
        const url = 'https://api.mymemory.translated.net/get' +
          `?langpair=${from}|${to}&q=${encodeURIComponent(chunk)}`;
        const res = await fetch(url, { signal });
        if (!res.ok) throw new Error(`MyMemory: HTTP ${res.status}`);
        const data = await res.json();
        if (Number(data.responseStatus) !== 200) {
          throw new Error(`MyMemory: ${data.responseDetails || data.responseStatus}`);
        }
        results.push(decodeEntities(data.responseData.translatedText));
      }
      return results.join(' ');
    },
  };

  // Teilt Text an Satzgrenzen (notfalls an Wortgrenzen) in Stücke unter maxBytes.
  function splitIntoChunks(text, maxBytes) {
    const byteLength = (s) => new TextEncoder().encode(s).length;
    if (byteLength(text) <= maxBytes) return [text];

    const pieces = text.match(/[^.!?…\n]+[.!?…\n]*\s*/g) || [text];
    const chunks = [];
    let current = '';
    const push = (piece) => {
      if (byteLength(current + piece) <= maxBytes) {
        current += piece;
        return;
      }
      if (current) chunks.push(current.trim());
      current = '';
      if (byteLength(piece) <= maxBytes) {
        current = piece;
        return;
      }
      const words = piece.split(/(\s+)/).filter(Boolean);
      if (words.length > 1) {
        words.forEach(push);
        return;
      }
      // Einzelnes überlanges Wort: hart nach Zeichen teilen.
      let part = '';
      for (const ch of piece) {
        if (byteLength(part + ch) > maxBytes) {
          chunks.push(part);
          part = '';
        }
        part += ch;
      }
      current = part;
    };
    pieces.forEach(push);
    if (current.trim()) chunks.push(current.trim());
    return chunks;
  }

  function decodeEntities(s) {
    return s.replace(/&#(\d+);/g, (_, n) => String.fromCharCode(n))
      .replace(/&quot;/g, '"').replace(/&apos;|&#39;/g, "'")
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }

  class Translator {
    constructor({ provider = 'google', cacheSize = 500 } = {}) {
      this.provider = provider;
      this.cacheSize = cacheSize;
      this.cache = new Map();
    }

    async translate(text, from, to, { signal } = {}) {
      const input = text.trim();
      if (!input || from === to) return input;

      const key = `${from}|${to}|${input}`;
      if (this.cache.has(key)) return this.cache.get(key);

      const order = [this.provider, ...Object.keys(providers).filter((p) => p !== this.provider)];
      let lastError;
      for (const name of order) {
        try {
          const result = await providers[name](input, from, to, signal);
          this.remember(key, result);
          return result;
        } catch (err) {
          if (err.name === 'AbortError') throw err;
          lastError = err;
        }
      }
      throw lastError;
    }

    remember(key, value) {
      if (this.cache.size >= this.cacheSize) {
        this.cache.delete(this.cache.keys().next().value);
      }
      this.cache.set(key, value);
    }
  }

  Translator.providers = providers;
  Translator.splitIntoChunks = splitIntoChunks;

  if (typeof module !== 'undefined' && module.exports) module.exports = Translator;
  else global.Translator = Translator;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
(function () {
  'use strict';

  const LANGS = {
    de: { label: '🇩🇪 Deutsch', speech: 'de-DE' },
    bg: { label: '🇧🇬 Bulgarisch', speech: 'bg-BG' },
  };
  const other = (lang) => (lang === 'de' ? 'bg' : 'de');

  const $ = (sel) => document.querySelector(sel);
  const els = {
    tabs: document.querySelectorAll('.tab'),
    sourceLabel: $('#sourceLabel'),
    targetLabel: $('#targetLabel'),
    swapBtn: $('#swapBtn'),
    sourceText: $('#sourceText'),
    targetText: $('#targetText'),
    charCount: $('#charCount'),
    clearBtn: $('#clearBtn'),
    speakBtn: $('#speakBtn'),
    copyBtn: $('#copyBtn'),
    micBtn: $('#micBtn'),
    micLabel: $('#micLabel'),
    chat: $('#chat'),
    talkBtns: document.querySelectorAll('.talk-btn'),
    autoSpeak: $('#autoSpeak'),
    provider: $('#provider'),
    status: $('#status'),
  };

  // ---------- Einstellungen (lokal gespeichert, falls möglich) ----------
  const settings = {
    load() {
      try { return JSON.parse(localStorage.getItem('dbg-settings')) || {}; } catch { return {}; }
    },
    save(values) {
      try { localStorage.setItem('dbg-settings', JSON.stringify(values)); } catch { /* egal */ }
    },
  };
  const saved = settings.load();
  let source = saved.source === 'bg' ? 'bg' : 'de';
  if (typeof saved.autoSpeak === 'boolean') els.autoSpeak.checked = saved.autoSpeak;
  if (saved.provider) els.provider.value = saved.provider;

  const translator = new Translator({ provider: els.provider.value });

  function persist() {
    settings.save({ source, autoSpeak: els.autoSpeak.checked, provider: els.provider.value });
  }

  function setStatus(text, isError = false) {
    els.status.textContent = text;
    els.status.classList.toggle('error', isError);
  }

  // ---------- Sprachausgabe ----------
  const synth = window.speechSynthesis;
  let speechQueue = Promise.resolve();
  let speaking = 0;
  let speechGeneration = 0;
  const warnedVoices = new Set();

  function findVoice(lang) {
    if (!synth) return null;
    const voices = synth.getVoices();
    const prefix = lang.slice(0, 2);
    return voices.find((v) => v.lang === lang) ||
      voices.find((v) => v.lang.replace('_', '-').toLowerCase().startsWith(prefix)) || null;
  }

  function speakNow(text, lang) {
    return new Promise((resolve) => {
      if (!synth || !text) return resolve();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = LANGS[lang].speech;
      const voice = findVoice(utter.lang);
      if (voice) utter.voice = voice;
      else if (synth.getVoices().length && !warnedVoices.has(lang)) {
        warnedVoices.add(lang);
        setStatus(`Hinweis: Keine ${lang === 'bg' ? 'bulgarische' : 'deutsche'} Stimme auf diesem Gerät installiert – die Ausgabe klingt evtl. falsch.`);
      }
      utter.onend = utter.onerror = () => resolve();
      synth.speak(utter);
    });
  }

  // Sätze nacheinander vorlesen; während des Vorlesens wird das Mikrofon pausiert,
  // damit die eigene Sprachausgabe nicht wieder erkannt wird.
  function speak(text, lang) {
    speaking++;
    pauseRecognitionForSpeech();
    const generation = speechGeneration;
    speechQueue = speechQueue
      .then(() => generation === speechGeneration && speakNow(text, lang))
      .finally(() => {
        speaking--;
        if (!speaking) resumeRecognitionAfterSpeech();
      });
    return speechQueue;
  }

  function cancelSpeech() {
    speechGeneration++;
    if (synth) synth.cancel();
  }

  // ---------- Spracherkennung (gemeinsame Hilfen) ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function recognitionErrorText(error) {
    switch (error) {
      case 'not-allowed':
      case 'service-not-allowed':
        return 'Mikrofonzugriff verweigert. Bitte im Browser erlauben (Seite muss über HTTPS oder localhost laufen).';
      case 'audio-capture': return 'Kein Mikrofon gefunden.';
      case 'network': return 'Netzwerkfehler bei der Spracherkennung.';
      case 'language-not-supported': return 'Diese Sprache wird von der Spracherkennung des Browsers nicht unterstützt.';
      default: return `Spracherkennung: ${error}`;
    }
  }

  // ---------- Tab 1: Übersetzer ----------
  let translateTimer = null;
  let translateController = null;

  function renderLanguages() {
    els.sourceLabel.textContent = LANGS[source].label;
    els.targetLabel.textContent = LANGS[other(source)].label;
    els.sourceText.lang = source;
    els.targetText.lang = other(source);
    els.sourceText.placeholder = source === 'de'
      ? 'Text eingeben oder Mikrofon antippen …'
      : 'Въведете текст или натиснете микрофона …';
  }

  function scheduleTranslate(delay) {
    clearTimeout(translateTimer);
    translateTimer = setTimeout(runTranslate, delay);
  }

  async function runTranslate() {
    const text = els.sourceText.value;
    els.charCount.textContent = text.length;
    if (translateController) translateController.abort();
    if (!text.trim()) {
      els.targetText.textContent = '';
      return;
    }
    const controller = translateController = new AbortController();
    try {
      const result = await translator.translate(text, source, other(source), { signal: controller.signal });
      if (controller !== translateController) return;
      els.targetText.textContent = result;
      if (els.status.classList.contains('error')) setStatus('');
    } catch (err) {
      if (err.name !== 'AbortError') setStatus(`Übersetzung fehlgeschlagen: ${err.message}`, true);
    }
  }

  let recognition = null;
  let wantListening = false;
  let pausedForSpeech = false;

  function startRecognition() {
    if (recognition) return;
    const rec = recognition = new SpeechRecognition();
    rec.lang = LANGS[source].speech;
    rec.continuous = true;
    rec.interimResults = true;

    const existing = els.sourceText.value.trim();
    const base = existing ? existing + ' ' : '';
    let finals = '';

    rec.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const transcript = result[0].transcript.trim();
        if (!transcript) continue;
        if (result.isFinal) {
          finals += transcript + ' ';
          onFinalSegment(transcript, source);
        } else {
          interim += transcript + ' ';
        }
      }
      els.sourceText.value = (base + finals + interim).trimEnd();
      els.sourceText.scrollTop = els.sourceText.scrollHeight;
      scheduleTranslate(interim ? 250 : 0);
    };

    rec.onerror = (event) => {
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      setStatus(recognitionErrorText(event.error), true);
      if (['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(event.error)) {
        stopListening();
      }
    };

    // Browser beenden die Erkennung nach einer Pause von selbst – solange der Nutzer
    // zuhören möchte, wird sie neu gestartet.
    rec.onend = () => {
      if (recognition === rec) recognition = null;
      // Nicht abgeschlossene Zwischenergebnisse verwerfen, damit sie beim Neustart nicht doppelt erscheinen.
      if (finals || els.sourceText.value !== existing) {
        els.sourceText.value = (base + finals).trimEnd();
        scheduleTranslate(0);
      }
      if (wantListening && !pausedForSpeech) setTimeout(() => wantListening && !pausedForSpeech && startRecognition(), 150);
    };

    try {
      rec.start();
    } catch (err) {
      recognition = null;
      setStatus(`Spracherkennung konnte nicht starten: ${err.message}`, true);
    }
  }

  async function onFinalSegment(text, lang) {
    if (!els.autoSpeak.checked) return;
    try {
      const translated = await translator.translate(text, lang, other(lang));
      speak(translated, other(lang));
    } catch (err) {
      setStatus(`Übersetzung fehlgeschlagen: ${err.message}`, true);
    }
  }

  function startListening() {
    if (!SpeechRecognition) return;
    wantListening = true;
    els.micBtn.classList.add('listening');
    els.micBtn.setAttribute('aria-pressed', 'true');
    els.micLabel.textContent = source === 'de' ? 'Hört zu … (Stopp)' : 'Слушам … (Стоп)';
    setStatus('');
    startRecognition();
  }

  function stopListening() {
    wantListening = false;
    els.micBtn.classList.remove('listening');
    els.micBtn.setAttribute('aria-pressed', 'false');
    els.micLabel.textContent = 'Sprechen';
    if (recognition) recognition.stop();
  }

  function pauseRecognitionForSpeech() {
    pausedForSpeech = true;
    if (recognition) recognition.stop();
    if (conversation.rec) conversation.rec.abort();
  }

  function resumeRecognitionAfterSpeech() {
    pausedForSpeech = false;
    if (wantListening) startRecognition();
  }

  els.sourceText.addEventListener('input', () => scheduleTranslate(400));

  els.swapBtn.addEventListener('click', () => {
    const wasListening = wantListening;
    if (wasListening) stopListening();
    source = other(source);
    const translated = els.targetText.textContent;
    els.sourceText.value = translated;
    renderLanguages();
    persist();
    runTranslate();
    if (wasListening) setTimeout(startListening, 300);
  });

  els.clearBtn.addEventListener('click', () => {
    const wasListening = wantListening;
    if (wasListening) stopListening();
    els.sourceText.value = '';
    runTranslate();
    els.sourceText.focus();
    if (wasListening) setTimeout(startListening, 300);
  });

  els.speakBtn.addEventListener('click', () => {
    cancelSpeech();
    speak(els.targetText.textContent, other(source));
  });

  els.copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(els.targetText.textContent);
      setStatus('In die Zwischenablage kopiert.');
    } catch {
      setStatus('Kopieren nicht möglich.', true);
    }
  });

  els.micBtn.addEventListener('click', () => (wantListening ? stopListening() : startListening()));

  // ---------- Tab 2: Gespräch ----------
  const conversation = { rec: null, lang: null };

  function addBubble(lang) {
    const empty = els.chat.querySelector('.chat-empty');
    if (empty) empty.remove();
    const bubble = document.createElement('div');
    bubble.className = `bubble ${lang}`;
    bubble.innerHTML = '<div class="original interim" lang="' + lang + '"></div>' +
      '<div class="translation" lang="' + other(lang) + '"></div>';
    els.chat.appendChild(bubble);
    els.chat.scrollTop = els.chat.scrollHeight;
    return bubble;
  }

  function setTalkState(activeLang) {
    els.talkBtns.forEach((btn) => {
      const isActive = btn.dataset.lang === activeLang;
      btn.classList.toggle('listening', isActive);
      btn.disabled = activeLang !== null && !isActive;
    });
  }

  function talk(lang) {
    if (conversation.rec) {
      conversation.rec.stop();
      return;
    }
    cancelSpeech();

    const rec = new SpeechRecognition();
    rec.lang = LANGS[lang].speech;
    rec.continuous = false;
    rec.interimResults = true;
    conversation.rec = rec;
    conversation.lang = lang;
    setTalkState(lang);
    setStatus('');

    const bubble = addBubble(lang);
    const originalEl = bubble.querySelector('.original');
    const translationEl = bubble.querySelector('.translation');
    let finalText = '';

    rec.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (result.isFinal) finalText += result[0].transcript;
        else interim += result[0].transcript;
      }
      originalEl.textContent = (finalText + ' ' + interim).trim();
      els.chat.scrollTop = els.chat.scrollHeight;
    };

    rec.onerror = (event) => {
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        setStatus(recognitionErrorText(event.error), true);
      }
    };

    rec.onend = async () => {
      conversation.rec = null;
      setTalkState(null);
      const text = (finalText || originalEl.textContent).trim();
      if (!text) {
        bubble.remove();
        return;
      }
      originalEl.textContent = text;
      originalEl.classList.remove('interim');
      translationEl.textContent = '…';
      try {
        const translated = await translator.translate(text, lang, other(lang));
        translationEl.textContent = translated;
        const replay = document.createElement('button');
        replay.className = 'small-btn';
        replay.textContent = '🔊';
        replay.title = 'Erneut vorlesen';
        replay.addEventListener('click', () => speak(translated, other(lang)));
        bubble.appendChild(replay);
        els.chat.scrollTop = els.chat.scrollHeight;
        if (els.autoSpeak.checked) speak(translated, other(lang));
      } catch (err) {
        translationEl.textContent = '';
        setStatus(`Übersetzung fehlgeschlagen: ${err.message}`, true);
      }
    };

    try {
      rec.start();
    } catch (err) {
      conversation.rec = null;
      setTalkState(null);
      bubble.remove();
      setStatus(`Spracherkennung konnte nicht starten: ${err.message}`, true);
    }
  }

  els.talkBtns.forEach((btn) => btn.addEventListener('click', () => talk(btn.dataset.lang)));

  // ---------- Tabs & Einstellungen ----------
  els.tabs.forEach((tab) => tab.addEventListener('click', () => {
    if (wantListening) stopListening();
    if (conversation.rec) conversation.rec.abort();
    els.tabs.forEach((t) => {
      const active = t === tab;
      t.classList.toggle('active', active);
      t.setAttribute('aria-selected', String(active));
      document.getElementById(t.dataset.tab).hidden = !active;
    });
  }));

  els.autoSpeak.addEventListener('change', persist);
  els.provider.addEventListener('change', () => {
    translator.provider = els.provider.value;
    translator.cache.clear();
    persist();
    runTranslate();
  });

  // ---------- Start ----------
  renderLanguages();
  if (synth) synth.getVoices(); // Stimmenliste vorladen
  if (!SpeechRecognition) {
    els.micBtn.disabled = true;
    els.talkBtns.forEach((btn) => { btn.disabled = true; });
    setStatus('Spracherkennung wird von diesem Browser nicht unterstützt (Chrome, Edge oder Safari verwenden). Texteingabe funktioniert trotzdem.', true);
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline-Cache optional */ });
  }
})();
</script>
</body>
</html>
